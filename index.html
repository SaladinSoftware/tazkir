<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tazkir — Prayer Times</title>
    <script>
      // Apply the saved theme and language before first paint to avoid a flash
      // of the wrong one — for the language that flash is a full left/right layout
      // flip, so it is the more visible of the two. Storage keys must match
      // src/components/ThemeToggle.tsx and src/translations/index.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('tazkir-theme')
          var dark =
            stored === 'dark' ||
            (stored === null && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
        try {
          var lang = localStorage.getItem('tazkir-lang')
          if (lang !== 'ar' && lang !== 'en') {
            lang = navigator.language.toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'
          }
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
